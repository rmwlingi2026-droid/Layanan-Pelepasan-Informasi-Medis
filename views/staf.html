<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
    function resetForm() {
        document.getElementById('panel-success').classList.add('hidden');
        document.getElementById('panel-form').classList.remove('hidden');
        document.getElementById('pdfFile').value = '';
        document.getElementById('password').value = '';
        document.getElementById('status').textContent = '';
    }

    async function uploadPDF() {
        const fileInput = document.getElementById('pdfFile');
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');

        if (!fileInput.files[0]) {
            status.className = 'text-sm text-center text-red-500';
            status.textContent = '⚠️ Silakan pilih file PDF terlebih dahulu.';
            return;
        }
        if (password.length < 6) {
            status.className = 'text-sm text-center text-red-500';
            status.textContent = '⚠️ Password minimal 6 karakter.';
            return;
        }

        const file = fileInput.files[0];

        if (file.size > 4.5 * 1024 * 1024) {
            status.className = 'text-sm text-center text-red-500';
            status.textContent = '⚠️ Ukuran file terlalu besar (Maksimal 4.5 MB).';
            return;
        }

        btn.disabled = true;
        status.className = 'text-sm text-center text-gray-500';
        status.innerHTML = '<span class="spinner"></span>Mengunci file dengan enkripsi tingkat tinggi...';

        try {
            // Membaca file menjadi array buffer
            const arrayBuffer = await file.arrayBuffer();

            // Memuat dokumen ke PDF-Lib
            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);

            // MENYUNTIKKAN ENKRIPSI KUAT (STANDAR ADOBE)
            // Ini akan memaksa semua PDF Viewer (Browser/HP/Adobe) meminta password
            await pdfDoc.encrypt({
                userPassword: password,
                ownerPassword: password,
                permissions: {
                    printing: 'highResolution', // Hanya boleh dicetak
                    modifying: false,           // Tidak boleh diedit
                    copying: false,             // Tidak boleh di-copy paste teksnya
                    annotating: false
                }
            });

            // Menyimpan PDF yang sudah terkunci rapat
            const pdfBytes = await pdfDoc.save();

            // Unduh file
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `TERKUNCI_${file.name}`;
            a.click();
            URL.revokeObjectURL(url);

            document.getElementById('panel-form').classList.add('hidden');
            document.getElementById('panel-success').classList.remove('hidden');

        } catch (err) {
            status.className = 'text-sm text-center text-red-500';
            // Jika error karena file kiriman SIMRS sudah memiliki proteksi enkripsi bawaan:
            status.textContent = `❌ Gagal: File PDF ini aslinya sudah diproteksi/enkripsi oleh sistem asal.`;
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    }
</script>
